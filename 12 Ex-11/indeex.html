<!-- calculate factorial usinf reduce and for loop -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial</title>
</head>
<body>
    <script>
        let vari = prompt(`Enter the No: `);
        let fact = 1;
        for(i=vari ; i>0 ; i--){
            fact *=i;   
        }
        console.log(fact)
    </script>
</body>
</html>
