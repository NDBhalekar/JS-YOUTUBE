      position: relative

Element apni original jagah par hi rehta hai.

Agar top, left, right, bottom use karo → apni original position se move hota hai.

Space original jagah par reserve rehta hai.-
      
      position: absolute

Element normal document flow se bahar nikal jata hai.

Position nearest positioned parent (relative / absolute / fixed) ke according set hoti hai.

Original space reserve nahi hota.
